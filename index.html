#items{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}

.mid{min-height:100%;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
.card{max-width:440px;width:100%;background:var(--panel);border:1px solid var(--line);padding:22px 20px;text-align:center}
.pc{display:flex;gap:14px;flex-wrap:wrap;border:1px solid var(--line);padding:12px;margin-bottom:12px;background:rgba(255,255,255,.03)}
.pc img{width:240px;max-width:100%;height:auto;align-self:flex-start;background:radial-gradient(circle at 50% 45%,var(--btn),transparent 72%)}
.card img{width:240px;max-width:100%;height:auto}
.inf{flex:1;min-width:230px}.big{font-size:26px;font-weight:700}
.stat{display:flex;align-items:center;gap:8px;font-size:15px;margin:3px 0}.stat span{width:64px;color:var(--dim)}.stat .bg{flex:1;height:8px;background:var(--btn)}.stat i{display:block;height:100%;background:var(--a1)}.stat b{width:34px;text-align:right}
h1{margin:0;font-size:38px;line-height:1}h2{margin:8px 0;font-size:26px}
p{margin:0 0 10px;color:var(--dim);font-size:18px;line-height:1.35}
button{margin:6px 6px 0 0;font:inherit;font-size:18px;font-weight:700;color:#04101a;background:var(--a1);border:0;padding:9px 18px;cursor:pointer}
button.alt{background:var(--btn);color:var(--fg)}button.on{background:var(--a2);color:#04101a}button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:10px}
.grid button{margin:0;padding:6px 0;background:var(--btn);color:var(--fg)}.grid button.on{background:var(--a2);color:#04101a}
.grid small{display:block;color:var(--a2);font-size:12px;line-height:1.1}.grid .on small{color:#04101a}
.gold{color:var(--a2)}.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px}
input[type=range]{width:100%;accent-color:var(--a1)}
input:not([type=range]){display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;font:inherit;font-size:18px;color:var(--fg);background:var(--btn);border:1px solid var(--line);user-select:text;-webkit-user-select:text}
#logo{width:64px;height:64px;border-radius:16px}
.hd{display:flex;align-items:center;gap:12px}
</style>

      var own=save.owned[p.id];
      h+='<div class="pc">'+img(p)+'<div class="inf"><div class="big">'+p.name+' <span style="color:'+hex(p.color)+'">●</span></div><p>'+L('pl')[p.id]+'</p>'+stats(p);
      if(!own)h+='<button data-a="buy" data-b="'+p.id+'"'+(save.coins<p.price?' disabled':'')+'>'+L('buy')+' · '+p.price+'</button>';
      else{h+='<button data-a="sel" data-b="'+p.id+'" class="'+(save.sel==p.id?'on':'')+'">'+(save.sel==p.id?L('selected'):L('select'))+'</button><p style="margin:8px 0 0">'+L('up')+':</p>';
        var u=save.up[p.id];for(var q in UPK){var l=u[q];h+='<button class="alt" data-a="up" data-b="'+p.id+':'+q+'"'+(l>=5||save.coins<upCost(l)?' disabled':'')+'>'+L(UPK[q])+' '+l+'/5'+(l>=5?'':' · '+upCost(l))+'</button>'}}
      h+='</div></div>';
    });
    if(UI.tab=='items')IT.forEach(function(it){
      h+='<div class="pc"><div style="font-size:70px;width:120px;text-align:center">'+it[2]+'</div><div class="inf"><div class="big">'+L(it[0])+'</div><p>'+L(it[0]+'d')+'</p><p>'+L('have',save.items[it[0]])+'</p><button data-a="item" data-b="'+it[0]+'"'+(save.coins<it[1]?' disabled':'')+'>'+L('buy')+' · '+it[1]+'</button></div></div>'});
    if(UI.tab=='set')h+='<h2>'+L('sound')+'</h2><button class="'+(save.snd.on?'on':'alt')+'" data-a="snd">'+(save.snd.on?L('son'):L('soff'))+'</button><p style="margin-top:10px">'+L('eng')+'</p><input type="range" min="0" max="100" value="'+Math.round(save.snd.eng*100)+'" data-k="eng"><p>'+L('fx')+'</p><input type="range" min="0" max="100" value="'+Math.round(save.snd.fx*100)+'" data-k="fx"><h2>'+L('theme')+' / '+L('lang')+'</h2>'+themeRow()+langRow();
    if(UI.tab=='acc')h+=accTab();
    if(UI.tab=='about')h+='<h2>'+L('abt')+'</h2>'+L('ab').map(function(x){return '<p>• '+x+'</p>'}).join('')+langRow();
    h+='</div><div class="bar"><span style="font-size:18px">'+p0.name+' · '+TIERS[save.tier]+' '+L('lvl')+' '+save.lvl+' · '+L(save.env)+'</span><button data-a="ready"'+(ok?'':' disabled')+'>'+L('startgame')+'</button></div>';
  }
  if(s=='welcome')h=welcomeScr();if(s=='login')h=loginScr();
  if(s=='ready')h='<div class="mid"><div class="card"><h2>'+L('ready')+'</h2>'+img(p0)+'<p>'+p0.name+' · '+TIERS[save.tier]+' '+L('lvl')+' '+save.lvl+' · '+L(save.env)+'</p><p>💣 '+save.items.bomb+' · 🛡️ '+save.items.shield+'</p><button data-a="go">'+L('start')+'</button><button class="alt" data-a="home">'+L('back')+'</button></div></div>';
  if(s=='res'){var r=UI.res;
    h='<div class="mid"><div class="card"><h2>'+(r.win?L('cleared',cur.n):L('lost'))+'</h2>'+(r.win?'<p class="gold" style="font-size:34px;margin:0">'+stars(r.stars)+'</p>'+(r.stars<3?'<p>'+L('startip')+'</p>':''):'')+'<p>'+L('score')+': <b class="gold">'+r.score+'</b>'+(r.nh?' · <b class="gold">'+L('newhi')+'</b>':'')+'<br>'+L('earned')+': <b class="gold">'+r.gain+'</b></p>';
    if(r.win&&cur.n<45)h+='<button data-a="next">'+L('next')+'</button>';
    h+='<button class="alt" data-a="retry">'+(r.win?L('replay'):L('retry'))+'</button><button class="alt" data-a="home">'+L('home')+'</button></div></div>';
  }
  $('ui').innerHTML=h;
  if(s=='welcome'||s=='login'){var f0=$('fn')||$('lp');if(f0)f0.focus()}
}
$('ui').addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  var a=el.dataset.a,b=el.dataset.b;AU.init();AU.click();
  if(a=='tab')UI.tab=b;
  else if(a=='tier'){save.tier=+b;if(!unlocked(save.tier,save.lvl))save.lvl=1;store()}
  else if(a=='lvl'){save.lvl=+b;store()}
  else if(a=='env'){save.env=b;store();setEnv(b=='day')}
  else if(a=='lang'){save.lang=b;GL=b;try{localStorage.setItem('voidLang',b)}catch(e){}store()}
  else if(a=='theme'){save.theme=+b;applyTheme();store()}
  else if(a=='snd'){save.snd.on=!save.snd.on;AU.vol();store()}
  else if(a=='buy'){var p=plane(b);if(save.coins>=p.price){save.coins-=p.price;save.owned[b]=1;save.up[b]={h:0,r:0,s:0,p:0};save.sel=b;store()}}
  else if(a=='sel'){save.sel=b;store()}
  else if(a=='up'){var id=b.split(':')[0],k=b.split(':')[1],l=save.up[id][k],c=upCost(l);if(l<5&&save.coins>=c){save.coins-=c;save.up[id][k]++;store()}}
  else if(a=='item'){var it=IT.filter(function(x){return x[0]==b})[0];if(save.coins>=it[1]){save.coins-=it[1];save.items[b]++;store()}}
  else if(a=='install'){if(dip){dip.prompt();dip.userChoice.then(function(){dip=null;draw()})}return}
  else if(a=='first'){var n1=cleanName($('fn').value),e1=checkName(n1);if(e1){msg('msg1',e1);return}
    var id1='a'+rnd();ACC.list.push({id:id1,name:n1,s:'',h:''});if(!saveAcc()){ACC.list.pop();msg('msg1',L('eStore'));return}
    var old=rj('voidSave2');wj('voidS3_'+id1,old?mergeSave(old):freshSave());enter(id1);return}
  else if(a=='create'){var n2=cleanName($('fn').value),p1=$('fp').value,p2=$('fp2').value,e2=checkName(n2)||(p1.length<4?L('ePw'):'')||(p1!=p2?L('eMatch'):'');
    if(e2){msg('msg1',e2);return}
    var sl=rnd();hashPw(p1,sl).then(function(hh){var id2='a'+rnd();ACC.list.push({id:id2,name:n2,s:sl,h:hh});if(!saveAcc()){ACC.list.pop();msg('msg1',L('eStore'));return}wj('voidS3_'+id2,freshSave());UI.note=L('created',n2);draw()});return}
  else if(a=='switch'){var sa=findAcc(b);if(!sa)return;if(sa.h){UI.lg={id:b,mode:'switch'};UI.s='login'}else{enter(b);return}}
  else if(a=='delpick'){UI.lg={id:b,mode:'del'};UI.s='login'}
  else if(a=='guest'){enterGuest();return}
  else if(a=='lgok'){var gl=UI.lg,ac=findAcc(gl.id);if(!ac)return;
    var go=function(){if(gl.mode=='del')delAcc(ac.id);else enter(ac.id)};
    if(!ac.h){go();return}
    if(Date.now()<lockT){msg('msg',L('eLock',Math.ceil((lockT-Date.now())/1000)));return}
    hashPw($('lp').value,ac.s).then(function(hh){if(hh===ac.h){fails=0;go()}else{fails++;if(fails>=5){lockT=Date.now()+30000;fails=0}msg('msg',L('eWrong'))}});return}
  else if(a=='setpw'){var ca=findAcc(curId);if(!ca)return;var np=$('np').value,np2=$('np2').value,cp=ca.h?$('cp').value:'';
    if(np.length<4){msg('msg2',L('ePw'));return}if(np!=np2){msg('msg2',L('eMatch'));return}
    verify(ca,cp).then(function(ok){if(!ok){msg('msg2',L('eWrong'));return}var ns=rnd();hashPw(np,ns).then(function(hh){ca.s=ns;ca.h=hh;saveAcc();UI.note=L('pwSet');draw()})});return}
  else if(a=='rmpw'){var ra=findAcc(curId);if(!ra)return;
    verify(ra,$('cp')?$('cp').value:'').then(function(ok){if(!ok){msg('msg2',L('eWrong'));return}ra.s='';ra.h='';saveAcc();UI.note=L('pwRmd');draw()});return}
  else if(a=='ready')UI.s='ready';
  else if(a=='home')UI.s='home';
  else if(a=='go'){play(save.tier,save.lvl);return}
  else if(a=='next'){play(cur.t,cur.n+1);return}
  else if(a=='retry'){play(cur.t,cur.n);return}
  var sy=$('ui').scrollTop;draw();$('ui').scrollTop=sy;
});
$('ui').addEventListener('input',function(e){var k=e.target.dataset.k;if(!k)return;save.snd[k]=e.target.value/100;store();
  if(k=='fx'){AU.init();AU.tone(700,.1,'triangle',.15)}AU.eng(playing&&!paused&&cd<=0,S?S.spd:1)});
$('bPause').addEventListener('click',pauseGame);
$('bPlay').addEventListener('click',function(){if(playing&&paused&&cd<=0)startCd()});
$('bHome').addEventListener('click',goHome);
$('bBomb').addEventListener('click',useBomb);$('bShield').addEventListener('click',useShield);
addEventListener('beforeinstallprompt',function(e){e.preventDefault();if(!matchMedia('(display-mode: standalone)').matches){dip=e;if(UI.s=='home')draw()}});
addEventListener('appinstalled',function(){dip=null;if(UI.s=='home')draw()});
document.addEventListener('visibilitychange',function(){store();if(document.hidden)pauseGame()});
addEventListener('pagehide',store);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName=='INPUT'){if(e.key=='Enter'){var pb=$('ui').querySelector('[data-p]');if(pb)pb.click()}return}
  var k=e.key.toLowerCase();
  if(k=='escape'){if(playing){paused&&cd<=0?startCd():pauseGame()}return}
  if(k=='b'){useBomb();return}if(k=='n'){useShield();return}
  keys[k]=1;if(e.key.indexOf('Arrow')==0)e.preventDefault()});
addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});
function point(e){if(e.target.closest&&e.target.closest('button'))return;tx=((e.clientX/innerWidth)*2-1)*rx;ty=-((e.clientY/innerHeight)*2-1)*ry}
addEventListener('pointermove',function(e){if(playing&&!paused)point(e)});
addEventListener('pointerdown',function(e){if(playing&&!paused)point(e)});
addEventListener('resize',function(){W=innerWidth;H=innerHeight;renderer.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix();limits()});
limits();setShip();ship.visible=false;
var f1=ACC.list[0];
if(!f1)UI.s='welcome';
else if(f1.h){UI.s='login';UI.lg={id:f1.id,mode:'start'}}
else{save=loadSave(f1.id);curId=f1.id}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
AU.vol();applyTheme();draw();btns();

// ---------- loop ----------
var last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&cd>0){var n0=Math.ceil(cd);cd-=dt;
    if(cd<=0){cd=0;paused=false;$('cd').classList.add('hide');AU.tone(990,.25,'square',.12);AU.eng(true,S.spd);btns()}
    else{var n1=Math.ceil(cd);if(n1!=n0){$('cd').textContent=n1;AU.tone(660,.1,'square',.1)}}}
  var act=playing&&!paused,vs=(act?40:12)*dt,p=sg.attributes.position;
  for(var i=0;i<N;i++){var z=p.array[i*3+2]+vs;if(z>10)z=-150;p.array[i*3+2]=z}p.needsUpdate=true;
  earth.material.map.offset.y+=vs*.012;
  clouds.children.forEach(function(c){c.position.z+=vs*.8;if(c.position.z>20)c.position.z=-150});
  if(act){
    var k=14*S.spd*dt;
    if(keys['arrowleft']||keys['a'])tx-=k;if(keys['arrowright']||keys['d'])tx+=k;
    if(keys['arrowup']||keys['w'])ty+=k;if(keys['arrowdown']||keys['s'])ty-=k;
    tx=Math.max(-rx,Math.min(rx,tx));ty=Math.max(-ry,Math.min(ry,ty));
    var px=ship.position.x,f=Math.min(1,dt*10*S.spd);
    ship.position.x+=(tx-px)*f;ship.position.y+=(ty-ship.position.y)*f;
    ship.rotation.z=(px-tx)*.12;ship.rotation.x=(ship.position.y-ty)*.1;
    if(invul>0){invul-=dt;shipG.visible=Math.floor(invul*14)%2==0}else shipG.visible=true;
    if(shieldT>0){shieldT-=dt;if(shieldT<=0){shieldT=0;shieldM.visible=false;hud()}else shieldM.visible=shieldT>1.5||Math.floor(shieldT*10)%2==0}
    fireT-=dt;if(fireT<=0){fire();fireT=.2/S.spd}
    spawnT-=dt;if(spawnT<=0){spawn();spawnT=cur.gap}
    for(var b=bullets.length-1;b>=0;b--){var bm=bullets[b].m;bm.position.z-=90*dt;if(bm.position.z<-S.range)kill(bullets,b)}
    for(var e=enemies.length-1;e>=0;e--){
      var en=enemies[e],m=en.m;
      m.position.z+=en.speed*dt;m.position.x+=en.sx*dt;if(Math.abs(m.position.x)>rx+1)en.sx*=-1;
      m.rotation.x+=en.spin.x*dt*2;m.rotation.y+=en.spin.y*dt*2;m.rotation.z+=en.spin.z*dt*2;
      var dead=false;
      for(var c=bullets.length-1;c>=0;c--){var bp=bullets[c].m.position;
        if(Math.abs(bp.z-m.position.z)<en.r+.8&&Math.hypot(bp.x-m.position.x,bp.y-m.position.y)<en.r+.15){
          kill(bullets,c);en.hp-=S.pow;boom(bp,0xffb347,3);if(en.hp<=0){dead=true;break}}}
      if(dead){gotKill(en);AU.boom();boom(m.position,0xff8855,14);kill(enemies,e);hud();if(kills>=cur.target)finish(true);continue}
      if(m.position.z>-1.2&&m.position.z<1.6){
        dist.copy(m.position).sub(ship.position);dist.z=0;
        if(shieldT>0&&dist.length()<en.r+1.7){gotKill(en,false);AU.boom();boom(m.position,0x5ef2ff,12);kill(enemies,e);hud();if(kills>=cur.target)finish(true);continue}
        if(invul<=0&&dist.length()<en.r+plane().hr){hull--;invul=1.6;AU.hit();boom(ship.position,0x5ef2ff,18);kill(enemies,e);hud();
          if(hull<=0){boom(ship.position,0xffffff,30);AU.boom();ship.visible=false;finish(false)}continue}}
      if(m.position.z>8)kill(enemies,e);
    }
  }
  for(var q=parts.length-1;q>=0;q--){var pt=parts[q];if(paused)break;pt.life-=dt;pt.m.position.addScaledVector(pt.v,dt);
    pt.m.material.opacity=Math.max(0,pt.life/.7);pt.m.scale.setScalar(Math.max(.1,pt.life/.7));
    if(pt.life<=0){scene.remove(pt.m);pt.m.material.dispose();parts.splice(q,1)}}
  for(var x=fx.length-1;x>=0;x--){var o=fx[x];o.t+=dt;o.m.scale.setScalar(1+o.t*90);o.m.material.opacity=Math.max(0,.5-o.t);if(o.t>.5){scene.remove(o.m);fx.splice(x,1)}}
  cam.position.x+=((ship.position.x*.35)-cam.position.x)*Math.min(1,dt*4);cam.lookAt(cam.position.x*.5,0,-12);
  renderer.render(scene,cam);
}
requestAnimationFrame(loop);
})();
</script>
